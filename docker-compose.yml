name: mobogo-admin

services:
  mobogo-admin:
    container_name: mobogo-admin
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    image: mobogo-admin:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3333}:8080"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api}
    env_file:
      - path: .env
        required: false
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mobogo-network

networks:
  mobogo-network:
    name: mobogo-network
    driver: bridge
